<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BugHive</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="auth-page">
    <div class="auth-box card">
        <h1>🐝 BugHive</h1>
        <p class="muted">Sign in to your workspace</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Your password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Login</button>
        </form>
        <p class="muted small center mt">New here? <a href="/register.html">Create an account</a></p>
        <div class="demo-box">Demo: admin@bughive.com / Admin@123</div>
    </div>
    <script src="/js/common.js"></script>
    <script src="/js/login.js"></script>
</body>

</html>
