<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | BugHive</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="auth-page">
    <div class="auth-box card">
        <h1>🐝 BugHive</h1>
        <p class="muted">Create your free account</p>
        <form id="registerForm">
            <div class="form-group">
                <label for="name">Full name</label>
                <input type="text" id="name" placeholder="Aarav Sharma" required minlength="2" maxlength="50">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Minimum 6 characters" required minlength="6">
            </div>
            <div class="form-group">
                <label for="role">I am a</label>
                <select id="role">
                    <option value="developer">Developer (can work on issues)</option>
                    <option value="reporter">Reporter (reports bugs)</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Create Account</button>
        </form>
        <p class="muted small center mt">Already registered? <a href="/login.html">Login</a></p>
    </div>
    <script src="/js/common.js"></script>
    <script src="/js/register.js"></script>
</body>

</html>
